# device.conf: Redmi Note 14 5G (beryl, MT6855)
device beryl
	title	Redmi Note 14 5G (beryl)
	vendor	Xiaomi
	soc	mt6855
	defconfig	beryl_defconfig
	firmware	pull-firmware.sh
	maintainer	HakiOS Porting Team
	status display works 1080x2400, LK framebuffer at 0xfe0c0000 (fbbase=0xfe0c0000)
	status touch works FocalTech FT3519T over I2C@11ed0000 (addr 0x38, fw 0x70)
	status buttons partial MTK Keypad (0x1c00e000) Vol-Down (MEM1 bit 0)
	status cpu works 8 cores (2x A78 + 6x A55), PSCI SMP (cpus=8)
	status gpu missing Imagination PowerVR BXM-8-256 (Rogue RGX, requires DDK, not Mali)
	status storage works Samsung UFS 2.2 over UFSHCI@112b0000, 74 GPT partitions scanned (ufs=2 ufs_shared_pa=0x60004000)
	status sensors missing
	status wifi missing
	status bluetooth missing
	status audio missing
	status battery missing
	status haptic missing
	status camera missing
	status torch missing
	status cellular missing
	status thermal missing
